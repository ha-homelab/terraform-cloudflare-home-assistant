# Run from the repository root; see docs/cloudflared-containers.md.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    user: "${CLOUDFLARED_UID:-65532}:${CLOUDFLARED_GID:-65532}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - --grace-period
      - 30s
      - run
      - --token-file
      - /run/secrets/tunnel_token
    secrets: [tunnel_token]
    networks: [origin]
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  tunnel_token:
    file: "${TUNNEL_TOKEN_FILE:?Set TUNNEL_TOKEN_FILE to an absolute private token file path}"
networks:
  origin:
    external: true
    name: "${HA_NETWORK:-ha-origin}"
