name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      force-full: false
  terraform:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/terraform-ci.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      terraform-version: 1.15.7
      tflint-enabled: false
  contracts:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: Mock deployment contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Audit outbound connections
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - run: python3 scripts/ci.py
  documentation:
    name: Documentation and runtime examples
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Audit outbound connections
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install locked validation dependencies
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Test the validators
        run: python scripts/check-docs-tests.py
      - name: Validate documentation and SVGs
        run: python scripts/check-docs.py
      - name: Validate runtime examples offline
        run: python scripts/validate-examples.py
      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64|arm64) arch=arm64; checksum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo 'Unsupported Linux runner architecture' >&2; exit 1 ;;
          esac
          tools_dir=$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")
          archive="${tools_dir}/actionlint.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${arch}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Validate all Actions workflows
        run: actionlint -shellcheck='' -pyflakes=''
  security-analysis:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      languages: actions,python
      run-codeql: true
      run-trivy: false
      run-dependency-review: true
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-required.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
  gate:
    name: CI gate
    needs: ["contracts", "documentation", "scope", "security", "security-analysis", "terraform"]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 2
    steps:
      - name: Require the exact selected validation path
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['contracts', 'documentation', 'scope', 'security', 'security-analysis', 'terraform']
          always = ['documentation', 'scope', 'security', 'security-analysis']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          failed = {}
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name in always else 'skipped'
              if value['result'] != wanted:
                  failed[name] = {'actual': value['result'], 'expected': wanted}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
