name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/terraform-ci.yml@8008fd1db4c410640e7abddfc8bc75833cdcd970
    with:
      terraform-version: 1.15.7
      tflint-enabled: false
  contracts:
    name: Mock deployment contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - run: python3 scripts/ci.py
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-required.yml@8008fd1db4c410640e7abddfc8bc75833cdcd970
  gate:
    name: CI gate
    needs: [terraform, contracts, security]
    if: always()
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not all(job['result'] == 'success' for job in results.values()):
              raise SystemExit('Required validation failed or was skipped')
          print('All validation workflows passed')
          PY
