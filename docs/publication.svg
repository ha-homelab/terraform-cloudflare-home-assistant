<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant publication architecture</title>
  <desc id="desc">Public Terraform code and private account, zone, hostname and API credentials provision Cloudflare. A browser uses HTTPS through Cloudflare to cloudflared and Home Assistant. The connector establishes the outbound tunnel. Terraform state and connector credentials stay private. Native Home Assistant authentication remains enabled.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a182d"/><stop offset="1" stop-color="#18334b"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#57ded7"/><stop offset="1" stop-color="#8bb7ff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#9cb4cc" stroke-width="1.5"/></marker>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#57ded7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <rect x="40" y="40" width="5" height="78" rx="2" fill="url(#accent)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="66" y="57" font-size="13" font-weight="700" letter-spacing="2" fill="#7ce4de">HOME ASSISTANT / TERRAFORM</text>
    <text x="66" y="94" font-size="32" font-weight="700" fill="#f3f8ff">Your hostname. Your home. Clear boundaries.</text>
    <text x="66" y="124" font-size="17" fill="#bfd0e2">Reusable public code configures the route. Private inputs belong to your installation.</text>

    <rect x="40" y="160" width="1120" height="206" rx="16" fill="#10263c" stroke="#35516a"/>
    <text x="62" y="188" font-size="12" font-weight="700" letter-spacing="1.5" fill="#a3b9ce">01 / PROVISIONING</text>
    <rect x="62" y="206" width="228" height="114" rx="12" fill="#163a4d" stroke="#39888b"/>
    <text x="82" y="234" font-size="12" font-weight="700" fill="#7ce4de">PUBLIC REPOSITORY</text>
    <text x="82" y="263" font-size="20" font-weight="700" fill="#f3f8ff">Terraform code</text>
    <text x="82" y="289" font-size="14" fill="#c2d7e4">HCL · tests · documentation</text>

    <rect x="322" y="206" width="246" height="114" rx="12" fill="#2c2e51" stroke="#7773ab"/>
    <text x="342" y="234" font-size="12" font-weight="700" fill="#ccc2ff">PRIVATE INPUTS</text>
    <text x="342" y="263" font-size="16" font-weight="700" fill="#f3f8ff">Account · zone · hostname</text>
    <text x="342" y="289" font-size="14" fill="#d0cce7">API token via environment</text>

    <path d="M582 264H638" stroke="#9cb4cc" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="654" y="206" width="225" height="114" rx="12" fill="#422f28" stroke="#a77950"/>
    <text x="674" y="234" font-size="12" font-weight="700" fill="#ffc896">CLOUDFLARE API</text>
    <text x="674" y="263" font-size="20" font-weight="700" fill="#fff5ed">Create the route</text>
    <text x="674" y="289" font-size="14" fill="#e8ceba">Tunnel · configuration · DNS</text>

    <rect x="911" y="206" width="227" height="114" rx="12" fill="#172d45" stroke="#6283a4"/>
    <text x="931" y="234" font-size="12" font-weight="700" fill="#a9c9f0">PRIVATE STATE</text>
    <text x="931" y="263" font-size="20" font-weight="700" fill="#f3f8ff">Resource ownership</text>
    <text x="931" y="289" font-size="14" fill="#c2d7e4">Protected state and backups</text>
    <text x="62" y="346" font-size="14" fill="#a8bfd3">Terraform runs during provisioning and changes. It is not part of the live request path.</text>

    <text x="62" y="408" font-size="12" font-weight="700" letter-spacing="1.5" fill="#a3b9ce">02 / LIVE TRAFFIC</text>
    <rect x="614" y="426" width="546" height="204" rx="16" fill="#163831" stroke="#488b7b" stroke-dasharray="5 5"/>
    <text x="636" y="452" font-size="12" font-weight="700" letter-spacing="1" fill="#9adebf">YOUR NETWORK / RUNTIME</text>

    <rect x="62" y="472" width="190" height="107" rx="12" fill="#1b324b" stroke="#6e94b5"/>
    <path d="M82 491h23v18H82zM82 496h23" stroke="#a9c9f0" fill="none" stroke-width="2"/>
    <text x="82" y="537" font-size="20" font-weight="700" fill="#f3f8ff">Browser / app</text>
    <text x="82" y="561" font-size="14" fill="#c2d7e4">Your HTTPS hostname</text>

    <path d="M263 525H321" stroke="#9cb4cc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="276" y="508" font-size="12" fill="#bdcfe1">HTTPS</text>
    <rect x="338" y="472" width="202" height="107" rx="12" fill="#422f28" stroke="#a77950"/>
    <path d="M358 508h25a7 7 0 0 0 0-14 11 11 0 0 0-20-3 9 9 0 0 0-5 17" stroke="#ffc896" fill="none" stroke-width="2"/>
    <text x="358" y="537" font-size="20" font-weight="700" fill="#fff5ed">Cloudflare edge</text>
    <text x="358" y="561" font-size="14" fill="#e8ceba">DNS · TLS · routing</text>

    <path d="M552 525H634" stroke="#9cb4cc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="554" y="508" font-size="12" fill="#bdcfe1">Tunnel</text>
    <rect x="651" y="472" width="210" height="107" rx="12" fill="#26394e" stroke="#718fa6"/>
    <path d="M674 497h22m-5-5 5 5-5 5m-17 8h22m-17-5-5 5 5 5" fill="none" stroke="#a9c9f0" stroke-width="2"/>
    <text x="671" y="537" font-size="20" font-weight="700" fill="#f3f8ff">cloudflared</text>
    <text x="671" y="561" font-size="14" fill="#c2d7e4">Private connector token</text>

    <path d="M872 525H907" stroke="#9cb4cc" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="922" y="472" width="216" height="107" rx="12" fill="#194b40" stroke="#56ac92"/>
    <path d="m946 503 12-12 12 12v12h-24zm9 12v-9h6v9" fill="none" stroke="#95e5c7" stroke-width="2"/>
    <text x="942" y="537" font-size="20" font-weight="700" fill="#f0fff8">Home Assistant</text>
    <text x="942" y="561" font-size="14" fill="#bfe5d5">Native login · API · live UI</text>

    <path d="M752 589v20H438v-20" fill="none" stroke="#57ded7" stroke-width="2" marker-end="url(#teal)"/>
    <rect x="467" y="597" width="269" height="22" rx="5" fill="#0f2d32"/>
    <text x="479" y="612" font-size="12" fill="#8ce9df">Connector establishes the outbound connection</text>

    <rect x="40" y="658" width="1120" height="62" rx="12" fill="#102337"/>
    <circle cx="66" cy="682" r="4" fill="#57ded7"/>
    <text x="80" y="687" font-size="15" fill="#d7e7f4">No inbound router port is required for this route.</text>
    <circle cx="595" cy="682" r="4" fill="#b7a5f5"/>
    <text x="609" y="687" font-size="15" fill="#d7e7f4">Inputs, tokens and state stay outside public Git.</text>
    <text x="80" y="707" font-size="12" fill="#9bb5cc">Final origin hop: HTTP by default, or configured HTTPS. Run the connector and configure narrow HA proxy trust separately.</text>
  </g>
</svg>
